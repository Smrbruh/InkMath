name: Bug report
description: Report reproducible behavior that is not working as expected.
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: InkMath and Windows versions
      placeholder: InkMath 1.0.0, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small LaTeX example if relevant. Remove personal information.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or compiler log
      description: Optional. Do not include private notebook content or secrets.
