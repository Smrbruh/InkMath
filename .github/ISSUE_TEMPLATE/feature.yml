name: Feature request
description: Describe a problem and an improvement that would solve it.
title: '[Idea] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the workflow and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
