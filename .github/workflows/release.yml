name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ.' }
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:compile
      - run: npm run package
      - name: Archive and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "InkMath-$env:GITHUB_REF_NAME-Windows-x64.zip"
          Compress-Archive -Path dist/InkMath-win32-x64 -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          gh release create $env:GITHUB_REF_NAME $archive SHA256SUMS.txt --verify-tag --title "InkMath $env:GITHUB_REF_NAME · Paper Studio" --notes-file .github/RELEASE_NOTES.md
